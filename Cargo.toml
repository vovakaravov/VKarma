[package]
name = "vkarma"
version = "0.1.0"
edition = "2024"
description = "VKarma - Native GPUI Markdown Vault, Typst Live Studio, Spreadsheet & Code Workspace"
license = "MIT"

[[bin]]
name = "vkarma"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.10.0", features = [
    "tree-sitter",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-csharp",
    "tree-sitter-cpp",
    "tree-sitter-c",
    "tree-sitter-python",
    "tree-sitter-bash",
    "tree-sitter-lua",
    "tree-sitter-html",
    "tree-sitter-css",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-sql",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-cmake",
    "tree-sitter-make",
    "tree-sitter-zig",
] }
tree-sitter = "0.26"
codebook-tree-sitter-typst = "0.12.2"
ironcalc = "0.9.1"
csv = "1.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
