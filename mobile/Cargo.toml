[package]
name = "vkarma-mobile"
version = "0.1.0"
edition = "2024"
description = "VKarma Mobile - Native GPUI Markdown Vault & Notes Editor for Android"
license = "MIT"

[lib]
name = "vkarma_mobile"
crate-type = ["cdylib", "rlib"]

[dependencies]
vkarma-core = { path = "../core" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "ae6a3fdfef416e7040e773415ac9cbd8c623e5d5", default-features = false, features = ["component", "assets"] }
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "7548ebc4b24f00494af9976af8852c7163ded9ce" }
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[workspace]

